[package]
name = "finnie"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Stocks and crypto watchlists and charts"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
